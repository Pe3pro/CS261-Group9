services:
  db:
    image: mysql:8.4
    container_name: cs261-db
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: cs261db
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./demo
    container_name: cs261-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cs261db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root1234
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
