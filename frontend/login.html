<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>เข้าสู่ระบบ · ระบบสหกิจศึกษา</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="login">
    <header>ระบบสหกิจศึกษา<span>ติดต่อเจ้าหน้าที่</span></header>
    <div class="login">
        <div>
            <h1>เข้าสู่ระบบ<br>เพื่อใช้งานแอปพลิเคชัน</h1>
            <p class="sub">ใช้ Username และ Password ของมหาวิทยาลัย (บัญชี มธ.)<br><small>บัญชีทดลอง: staff01 · advisor01 · 6609650001 รหัสผ่าน 1234</small></p>
        </div>
        <form class="card" id="loginForm">
            <h2>Log in</h2>
            <div class="fld"><label for="u">Username</label><input id="u" placeholder="รหัสนักศึกษา / รหัสบุคลากร"
                    autocomplete="username" maxlength="50"></div>
            <div class="fld"><label for="p">Password</label><input id="p" type="password"
                    autocomplete="current-password"></div>
            <button class="btn full" type="submit" id="loginBtn">เข้าสู่ระบบ</button>
            <div class="alert bad" id="loginErr" role="alert" aria-live="assertive" style="margin:12px 0 0" hidden><b>Log in
                    ไม่สำเร็จ</b><br><span id="loginErrMsg">Username หรือ Password ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</span></div>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>

</html>
