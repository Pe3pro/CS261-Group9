spring.application.name=demo

# ===== Database =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cs261db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root1234}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== U5: ข้อมูลตัวอย่างสำหรับ demo (ใส่ให้เฉพาะตอนตาราง users ว่าง) =====
app.seed-demo-data=true

# ===== U1: Login ด้วยบัญชี มธ. (TU REST API) =====
tu.api.base-url=https://restapi.tu.ac.th
# Application-Key อ่านจาก environment variable TU_API_KEY เท่านั้น ห้ามใส่ค่าจริงในไฟล์นี้
tu.api.key=${TU_API_KEY:}
# บัญชีทดลองของ DemoDataSeeder (ไม่มีในระบบ มธ.) login ได้ด้วยรหัสผ่านทดลองนี้ · ปิดได้ด้วย APP_AUTH_DEMO_PASSWORD= (ค่าว่าง)
app.auth.demo-users=staff01,advisor01,6609650001,6609650002,6609650003,6609650004
app.auth.demo-password=${APP_AUTH_DEMO_PASSWORD:1234}

# ===== U3: ยื่นคำร้อง · ที่เก็บไฟล์ Transcript และขนาดไฟล์ที่รับ (ตรวจ 10 MB ใน DocumentService) =====
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
